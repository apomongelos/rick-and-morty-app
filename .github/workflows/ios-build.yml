name: iOS Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: string
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - stage
          - preprod
          - production
      buildName:
        description: 'Version name (optional, e.g. 1.1.0). Leave empty to use the version from app.json'
        required: false
        type: string
      upload_to_testflight:
        description: 'Upload to TestFlight? (production only; builds a signed IPA instead of the simulator build + GitHub Release flow)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest
    # Needed so the release action can create the release and the tag
    permissions:
      contents: write
    outputs:
      version: ${{ steps.app_version.outputs.version }}
      release_url: ${{ steps.create_release.outputs.url }}

    steps:
      - name: Debug inputs
        run: |
          echo "Branch: ${{ inputs.branch }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Build name: ${{ inputs.buildName }}"
          echo "Upload to TestFlight: ${{ inputs.upload_to_testflight }}"

      # Fail fast: only production builds can go to TestFlight
      - name: Block TestFlight upload outside production
        if: ${{ inputs.upload_to_testflight && inputs.environment != 'production' }}
        run: |
          echo "❌ TestFlight upload is only allowed for the production environment (got '${{ inputs.environment }}')"
          exit 1

      # Fail fast: don't spend a full build if the App Store Connect credentials are missing
      - name: Check App Store Connect credentials
        if: ${{ inputs.upload_to_testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_P8_CONTENT: ${{ secrets.APP_STORE_CONNECT_P8_CONTENT }}
        run: |
          MISSING=""
          [ -z "$APPLE_TEAM_ID" ] && MISSING="$MISSING APPLE_TEAM_ID"
          [ -z "$APP_STORE_CONNECT_KEY_ID" ] && MISSING="$MISSING APP_STORE_CONNECT_KEY_ID"
          [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] && MISSING="$MISSING APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$APP_STORE_CONNECT_P8_CONTENT" ] && MISSING="$MISSING APP_STORE_CONNECT_P8_CONTENT"
          if [ -n "$MISSING" ]; then
            echo "❌ TestFlight upload is not configured yet: missing secrets:$MISSING"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # versionName comes from the input (or app.json) and the build number from the run number,
      # so there is no need to commit a version bump back to the branch.
      - name: Set version in app.json
        id: app_version
        env:
          BUILD_NAME: ${{ inputs.buildName }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_INFO=$(node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const versionName = process.env.BUILD_NAME || config.expo.version;
            config.expo.version = versionName;
            config.expo.ios.buildNumber = process.env.BUILD_NUMBER;
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2));
            console.log(`${versionName}-${process.env.BUILD_NUMBER}`);
          ')

          echo "Version: $VERSION_INFO"
          echo "version=$VERSION_INFO" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Also runs `pod install`
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean
        env:
          APP_ENV: ${{ inputs.environment }}

      - name: Locate Xcode workspace
        id: xcode
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ Xcode workspace not found"
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE / Scheme: $SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      # --- PATH 1: Signed IPA uploaded to TestFlight (production only) ---
      # Uses Xcode cloud-managed signing with an App Store Connect API key (Admin role),
      # so no certificate / provisioning profile has to be stored in secrets.
      - name: Archive and upload to TestFlight
        if: ${{ inputs.upload_to_testflight && inputs.environment == 'production' }}
        env:
          APP_ENV: ${{ inputs.environment }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_P8_CONTENT: ${{ secrets.APP_STORE_CONNECT_P8_CONTENT }}
        run: |
          KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          ARCHIVE_PATH=$RUNNER_TEMP/app.xcarchive
          EXPORT_OPTIONS=$RUNNER_TEMP/ExportOptions.plist
          echo "$APP_STORE_CONNECT_P8_CONTENT" > "$KEY_PATH"

          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF

          AUTH_ARGS=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$KEY_PATH"
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          )

          xcodebuild archive \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            "${AUTH_ARGS[@]}"

          # With destination=upload, exportArchive sends the build straight to App Store Connect
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH_ARGS[@]}"

      # --- PATH 2: Simulator build attached to a GitHub Release for QA ---
      # The app has no Apple signing certificate yet, so an installable device IPA can't be
      # produced. A simulator build needs no signing and runs on any Mac's iOS Simulator.
      - name: Build for iOS Simulator
        if: ${{ !inputs.upload_to_testflight }}
        env:
          APP_ENV: ${{ inputs.environment }}
        run: |
          xcodebuild build \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO

      - name: Package simulator app
        if: ${{ !inputs.upload_to_testflight }}
        id: artifact
        run: |
          APP=$(find build/ios/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$APP" ]; then
            echo "❌ Generated .app not found"
            exit 1
          fi
          TARGET="rick-and-morty-ios-${{ inputs.environment }}-${{ steps.app_version.outputs.version }}-simulator.zip"
          ditto -c -k --keepParent "$APP" "$TARGET"
          echo "Artifact: $TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Create Release and attach simulator build
        if: ${{ !inputs.upload_to_testflight }}
        uses: softprops/action-gh-release@v2
        id: create_release
        with:
          tag_name: ios-${{ inputs.environment }}-v${{ steps.app_version.outputs.version }}
          target_commitish: ${{ steps.app_version.outputs.sha }}
          name: 'iOS [${{ inputs.environment }}] - v${{ steps.app_version.outputs.version }}'
          body: |
            Automatically generated iOS QA build (iOS Simulator only).
            - Branch: ${{ inputs.branch }}
            - Environment: ${{ inputs.environment }}
            - Version: ${{ steps.app_version.outputs.version }}
            - Commit: ${{ steps.app_version.outputs.sha }}

            To install: unzip it and drag the `.app` onto a booted simulator,
            or run `xcrun simctl install booted <path-to-app>`.
          files: ${{ steps.artifact.outputs.path }}
          prerelease: true

      - name: Job summary
        run: |
          echo "### ✅ iOS build completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${{ inputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.app_version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.upload_to_testflight }}" = "true" ]; then
            echo "- Uploaded to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Release: ${{ steps.create_release.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
