name: Android Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - stage
          - preprod
          - production
      upload_to_playstore:
        description: 'Upload to Google Play Store? (production only; builds an AAB instead of the APK + GitHub Release flow)'
        required: false
        type: boolean
        default: false

# Builds on the same branch run one at a time, so two runs never bump to the same versionCode
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    # Needed so the release action can create the release and the tag
    permissions:
      contents: write
    outputs:
      version: ${{ steps.app_version.outputs.version }}
      release_url: ${{ steps.create_release.outputs.url }}

    steps:
      - name: Debug inputs
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Upload to Play Store: ${{ inputs.upload_to_playstore }}"

      # Fail fast: only production builds can go to the Play Store
      - name: Block Play Store upload outside production
        if: ${{ inputs.upload_to_playstore && inputs.environment != 'production' }}
        run: |
          echo "❌ Play Store upload is only allowed for the production environment (got '${{ inputs.environment }}')"
          exit 1

      # Fail fast: don't spend a full build if the Play Store credentials are missing
      - name: Check Play Store credentials
        if: ${{ inputs.upload_to_playstore }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT" ]; then
            echo "❌ Play Store upload is not configured yet: missing GOOGLE_PLAY_SERVICE_ACCOUNT secret"
            exit 1
          fi

      # Short-lived (1h) token of the release-bot GitHub App, used to push the version bump.
      # Unlike GITHUB_TOKEN it can be allowed to bypass branch protection, and unlike a PAT
      # it is not tied to a personal account and never expires.
      - name: Generate release bot token
        id: bot_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      # Persists the bot token in the git config, so the later pull/push authenticate as the App
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot_token.outputs.token }}

      - name: Restore .env file for the environment
        env:
          ENV_STAGE_BASE64: ${{ secrets.ENV_STAGE_BASE64 }}
          ENV_PREPROD_BASE64: ${{ secrets.ENV_PREPROD_BASE64 }}
          ENV_PRODUCTION_BASE64: ${{ secrets.ENV_PRODUCTION_BASE64 }}
        run: |
          case "${{ inputs.environment }}" in
            stage) VALUE="$ENV_STAGE_BASE64"; TARGET="environments/.env.stage" ;;
            preprod) VALUE="$ENV_PREPROD_BASE64"; TARGET="environments/.env.preprod" ;;
            production) VALUE="$ENV_PRODUCTION_BASE64"; TARGET="environments/.env.prod" ;;
          esac
          echo "$VALUE" | base64 -d > "$TARGET"

      # Test only: decoded values are NOT masked by GitHub (only the base64 blob is), so this prints them in plain text
      - name: Debug env file
        run: |
          echo "⚠️ Printing the restored env file in plain text, use only with fake values"
          for FILE in environments/.env.*; do
            [ "$FILE" = "environments/.env.example" ] && continue
            echo "📄 $FILE"
            cat "$FILE"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # versionName always comes from app.json (bump it there via PR for minor/major releases);
      # versionCode is incremented by scripts/bump-version.js and committed back to the branch.
      - name: Bump versionCode in app.json
        id: app_version
        run: |
          node scripts/bump-version.js android

          VERSION_INFO=$(node -e '
            const config = require("./app.json");
            console.log(`${config.expo.version}-${config.expo.android.versionCode}`);
          ')

          echo "New version: $VERSION_INFO"
          echo "version=$VERSION_INFO" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_INFO%-*}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_INFO##*-}" >> "$GITHUB_OUTPUT"

      # Pushes as the release-bot App. Unlike GITHUB_TOKEN, App pushes DO trigger other workflows,
      # so the [skip ci] in the message is what keeps the bump commit from starting CI.
      # HUSKY=0 skips the local lint-staged hook.
      - name: Commit and push version bump
        id: bump_commit
        env:
          HUSKY: 0
          GH_TOKEN: ${{ steps.bot_token.outputs.token }}
          BOT_SLUG: ${{ steps.bot_token.outputs.app-slug }}
        run: |
          # Commit as the App's bot user so it shows with its avatar and the "bot" badge
          BOT_ID=$(gh api "/users/${BOT_SLUG}[bot]" --jq .id)
          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${BOT_ID}+${BOT_SLUG}[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "chore(android): bump versionCode to ${{ steps.app_version.outputs.version_code }} [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          APP_ENV: ${{ inputs.environment }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The app is not signed with a release keystore yet: Expo's generated build.gradle
      # signs the release build with the debug keystore, which is enough for QA installs.
      - name: Build release (AAB for Play Store, APK otherwise)
        working-directory: android
        env:
          APP_ENV: ${{ inputs.environment }}
        run: |
          chmod +x gradlew
          if [ "${{ inputs.upload_to_playstore }}" = "true" ]; then
            ./gradlew bundleRelease --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Locate generated artifact
        id: artifact
        run: |
          if [ "${{ inputs.upload_to_playstore }}" = "true" ]; then
            FILE=$(find android/app/build/outputs/bundle/release -type f -name "*.aab" | head -n1)
            EXT="aab"
          else
            FILE=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n1)
            EXT="apk"
          fi
          if [ -z "$FILE" ]; then
            echo "❌ Generated artifact not found"
            exit 1
          fi
          TARGET="rick-and-morty-${{ inputs.environment }}-${{ steps.app_version.outputs.version }}.$EXT"
          mv "$FILE" "$TARGET"
          echo "Artifact: $TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"

      # --- PATH 1: Upload AAB to Google Play Store (production only) ---
      - name: Upload AAB to Google Play Store
        if: ${{ inputs.upload_to_playstore && inputs.environment == 'production' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.apomongelos.rickandmortyapp
          releaseFiles: ${{ steps.artifact.outputs.path }}
          track: internal
          status: draft

      # --- PATH 2: Create GitHub Release and attach APK for QA ---
      - name: Create Release and attach APK
        if: ${{ !inputs.upload_to_playstore }}
        uses: softprops/action-gh-release@v2
        id: create_release
        with:
          tag_name: android-${{ inputs.environment }}-v${{ steps.app_version.outputs.version }}
          target_commitish: ${{ steps.bump_commit.outputs.sha }}
          name: 'Android ${{ inputs.environment }} v${{ steps.app_version.outputs.version_name }} (build ${{ steps.app_version.outputs.version_code }})'
          body: |
            Automatically generated QA build.
            - Branch: ${{ github.ref_name }}
            - Environment: ${{ inputs.environment }}
            - Version: ${{ steps.app_version.outputs.version }}
            - Commit: ${{ steps.bump_commit.outputs.sha }}
          files: ${{ steps.artifact.outputs.path }}
          prerelease: true

      - name: Send email with GitHub Release link
        if: ${{ !inputs.upload_to_playstore }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SERVER_SMTP }}
          server_port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 'Build Android completado - Versión ${{ steps.app_version.outputs.version }}'
          to: ${{ secrets.EMAIL_TO }}
          from: Información Github <${{ secrets.EMAIL_USERNAME }}>
          body: |
            Se ha completado el build de la aplicación con los siguientes parámetros:

            - Branch: ${{ github.ref_name }}
            - Environment: ${{ inputs.environment }}
            - Versión: ${{ steps.app_version.outputs.version }}

            Puedes descargar el APK de forma permanente desde los Releases de GitHub:
            ${{ steps.create_release.outputs.url }}

      - name: Job summary
        run: |
          echo "### ✅ Android build completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.app_version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.upload_to_playstore }}" = "true" ]; then
            echo "- Uploaded to Play Store (internal track, draft)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Release: ${{ steps.create_release.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          fi
