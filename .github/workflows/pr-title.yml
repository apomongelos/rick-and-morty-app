name: PR Title

# Separate from "Validate PR" so editing the title re-runs only this quick check,
# not the whole lint + tests job.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
      - develop

jobs:
  jira-key:
    name: Check Jira key in PR title
    runs-on: ubuntu-latest
    # Bot PRs (e.g. Dependabot) have no ticket; a skipped job still counts as passing
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    permissions: {}

    steps:
      # The title goes through env (not inlined in the script) so it can't inject shell commands
      - name: Check title starts with the Jira key
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
        run: |
          if [ -z "$JIRA_PROJECT_KEY" ]; then
            echo "⚠️ JIRA_PROJECT_KEY variable is not set, skipping the check"
            exit 0
          fi
          if [[ "$PR_TITLE" =~ ^${JIRA_PROJECT_KEY}-[0-9]+ ]]; then
            echo "✅ PR title references ${BASH_REMATCH[0]}"
          else
            echo "❌ PR title must start with the Jira key, e.g. \"${JIRA_PROJECT_KEY}-123: Add favorites screen\""
            echo "   Got: \"$PR_TITLE\""
            exit 1
          fi
