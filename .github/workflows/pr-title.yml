name: PR Title

# Separate from "Validate PR" so editing the title re-runs only these quick jobs,
# not the whole lint + tests job.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
      - develop

jobs:
  jira-key:
    name: Check Jira key in PR title
    runs-on: ubuntu-latest
    # Bot PRs (e.g. Dependabot) have no ticket; a skipped job still counts as passing
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    permissions: {}

    steps:
      # The key can be anywhere in the title, so Conventional Commits titles work too
      # ("feat: RM-123 add favorites", "feat(RM-123): add favorites", "RM-123: Add favorites").
      # The title goes through env (not inlined in the script) so it can't inject shell commands.
      - name: Check title contains the Jira key
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
        run: |
          if [ -z "$JIRA_PROJECT_KEY" ]; then
            echo "⚠️ JIRA_PROJECT_KEY variable is not set, skipping the check"
            exit 0
          fi
          # Not preceded by a letter/digit, so e.g. "ARM-5" doesn't count as "RM-5"
          if [[ "$PR_TITLE" =~ (^|[^A-Za-z0-9])(${JIRA_PROJECT_KEY}-[0-9]+) ]]; then
            echo "✅ PR title references ${BASH_REMATCH[2]}"
          else
            echo "❌ PR title must include the Jira key, e.g. \"feat: ${JIRA_PROJECT_KEY}-123 add favorites screen\""
            echo "   Got: \"$PR_TITLE\""
            exit 1
          fi

  jira-link:
    name: Add Jira link to PR description
    runs-on: ubuntu-latest
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    permissions:
      pull-requests: write

    steps:
      # Keys are taken from the PR title and the branch name. The link block sits between
      # markers, so later runs (title edited, new commits) replace it instead of duplicating it.
      # Body updates made with GITHUB_TOKEN don't trigger new workflow runs, so there is no loop.
      - name: Add or update the Jira link block
        uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
        with:
          script: |
            const { JIRA_PROJECT_KEY: key, JIRA_BASE_URL: baseUrl } = process.env;
            if (!key || !baseUrl) {
              core.notice('JIRA_PROJECT_KEY / JIRA_BASE_URL variables are not set, skipping');
              return;
            }

            const pr = context.payload.pull_request;
            const keyRegex = new RegExp(`\\b${key}-\\d+\\b`, 'g');
            const keys = [
              ...new Set([
                ...(pr.title.match(keyRegex) ?? []),
                ...(pr.head.ref.match(keyRegex) ?? []),
              ]),
            ];
            if (keys.length === 0) {
              core.notice('No Jira key found in the PR title or branch name');
              return;
            }

            const jiraUrl = baseUrl.replace(/\/$/, '');
            const links = keys.map(k => `[${k}](${jiraUrl}/browse/${k})`).join(', ');
            const block = `<!-- jira-links:start -->\n**Jira:** ${links}\n<!-- jira-links:end -->`;
            const blockRegex = /<!-- jira-links:start -->[\s\S]*?<!-- jira-links:end -->/;

            const body = pr.body ?? '';
            const newBody = blockRegex.test(body)
              ? body.replace(blockRegex, block)
              : `${block}\n\n${body}`;

            if (newBody === body) {
              core.info(`Jira link already up to date: ${keys.join(', ')}`);
              return;
            }
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: newBody,
            });
            core.info(`Added Jira link: ${keys.join(', ')}`);
